<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSM Visualizador XML 4.0</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div><strong>CSM Visualizador XML</strong><span>4.0 Alpha</span></div><div class="actions"><button id="folderBtn">Importar pasta</button><button id="pdfBtn">PDF único</button></div></header>
<section id="operation" class="operation hidden"><div class="op-row"><strong id="opTitle">Processando</strong><span id="opCount"></span></div><div class="progress"><i id="opBar"></i></div><div class="op-row sub"><span id="opMessage"></span><button id="cancelBtn" class="link">Cancelar</button></div></section>
<main><aside><div class="search"><input id="globalSearch" placeholder="Buscar chave, NF, CNPJ, produto, NCM, CFOP..."></div><div id="stats" class="stats">Biblioteca local</div><div id="list" class="list"></div></aside>
<section class="content"><div id="empty" class="empty"><h2>Selecione um documento</h2><p>Importe uma pasta ou escolha uma nota na biblioteca.</p></div><div id="doc" class="doc hidden"><div class="dochead"><div><h2 id="docTitle"></h2><p id="docMeta"></p></div><div class="pill" id="docValue"></div></div><div class="tabs"><button class="active">XML</button></div><div class="xmlbar"><input id="xmlSearch" placeholder="Buscar no XML (vICMS, CFOP, NCM, produto...)"><button id="xmlPrev">↑</button><button id="xmlNext">↓</button><span id="xmlCount">0</span><button id="xmlCopy">Copiar XML</button></div><pre id="xmlCode" class="xml"></pre></div></section></main>
<script src="xml_viewer.js"></script><script src="app.js"></script></body></html>
