name: Build CSM Visualizador XML 3.9.1 Final

on:
  push:
    branches: ["release/3.9.1"]
    paths:
      - "installer-v2/**"
      - ".github/workflows/build-3.9.1-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Baixar base estável 3.7.8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          gh release download v3.7.8 --repo 8453csm-dev/csm-visualizador-xml --pattern "CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" --dir temp

      - name: Montar payload completo 3.9.1
        shell: pwsh
        run: |
          python installer-v2/extract_payload.py "temp/CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" "installer-completo/enhancer_v8.html" "installer-v2/payload"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao extrair base estável" }
          python installer-v2/patch_runtime.py "installer-v2/payload/_internal/web"
          if ($LASTEXITCODE -ne 0) { throw "Falha no runtime" }
          python installer-v2/patch_lookup_order.py
          if ($LASTEXITCODE -ne 0) { throw "Falha no Localizador" }
          python installer-v2/patch_devolution_engine.py "installer-v2/payload/_internal/web"
          if ($LASTEXITCODE -ne 0) { throw "Falha no Motor de Devolução" }
          python installer-v2/patch_tax_explainer.py "installer-v2/payload/_internal/web"
          if ($LASTEXITCODE -ne 0) { throw "Falha no Entender a Tributação" }
          python installer-v2/patch_release_identity_391.py "installer-v2/payload/_internal/web" "installer-v2/payload/_internal/csm"
          if ($LASTEXITCODE -ne 0) { throw "Falha na identidade 3.9.1" }
          python installer-v2/patch_tax_explainer.py --extract temp/taxsrc
          if ($LASTEXITCODE -ne 0) { throw "Falha ao materializar fontes tributárias" }

          $app="installer-v2/payload/_internal/web/app.js"
          Copy-Item $app "temp/app-391.mjs" -Force
          node --check "temp/app-391.mjs"
          if ($LASTEXITCODE -ne 0) { throw "app.js final inválido como ES module" }
          node --check "temp/taxsrc/tax_engine_core.js"
          if ($LASTEXITCODE -ne 0) { throw "Motor tributário inválido" }
          node --check "temp/taxsrc/tax_explainer_ui.js"
          if ($LASTEXITCODE -ne 0) { throw "UI tributária inválida" }
          foreach($token in @('CSM_MULTI_TAB_BRIDGE_V1','CSM_LOCATOR_FIX_V1','CSM_DEVOLUTION_ENGINE_V1','CSM_DEVOLUTION_ENGINE_V2','CSM_DEVOLUTION_ENGINE_V3','CSM_DEVOLUTION_ENTRYPOINT_V4','Criar modelo de devolução','CSM_TAX_ENGINE_V1','CSM_TAX_EXPLAINER_UI_V1','CSM_TAX_EXPLAINER_NO_FREEZE_391','Entender a Tributação','get_xml_text','CSM_RELEASE_IDENTITY_3_9_1')) {
            if (!(Select-String -Path $app -Pattern $token -SimpleMatch -Quiet)) { throw "Componente ausente: $token" }
          }
          if(Select-String -Path $app -Pattern "if(eligible&&activeView==='taxexplain')csmTaxRenderCurrent();return true}" -SimpleMatch -Quiet){throw "Loop de renderização da 3.9.0 ainda presente"}
          $bi=Get-Content "installer-v2/payload/_internal/csm/build-info.json" -Raw | ConvertFrom-Json
          if($bi.version -ne '3.9.1' -or $bi.motor_devolucao -ne '1.3.0' -or $bi.entender_tributacao -ne '1.0.1' -or !$bi.entrypoint_deterministic -or !$bi.tax_xml_direct -or !$bi.tax_no_freeze_fix){throw "Build-info incorreto"}

      - name: Testar Devolução e Entender a Tributação sem congelamento
        timeout-minutes: 3
        shell: pwsh
        run: |
          npm install --no-save jsdom@26.1.0
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar jsdom" }
          node installer-v2/test_devolution_engine.js
          if ($LASTEXITCODE -ne 0) { throw "Motor de Devolução base regrediu" }
          node installer-v2/test_devolution_engine_v3.js
          if ($LASTEXITCODE -ne 0) { throw "Motor de Devolução ICMS-ST/PDF regrediu" }
          node installer-v2/test_devolution_entrypoint_v4.js
          if ($LASTEXITCODE -ne 0) { throw "Entrada da Devolução regrediu" }
          $env:CSM_TAX_CORE=(Resolve-Path "temp/taxsrc/tax_engine_core.js").Path
          $env:CSM_TAX_UI=(Resolve-Path "temp/taxsrc/tax_explainer_ui.js").Path
          node installer-v2/test_tax_engine.js
          if ($LASTEXITCODE -ne 0) { throw "Teste fiscal obrigatório da NF 640645 falhou" }
          node installer-v2/test_tax_ui.js
          if ($LASTEXITCODE -ne 0) { throw "Aba tributária congelou, duplicou render ou depende do timing" }

      - name: Preparar launcher e Consulta DANFE
        shell: pwsh
        run: |
          python installer-v2/patch_launcher_single_instance.py
          if ($LASTEXITCODE -ne 0) { throw "Falha na instância única" }
          python installer-v2/patch_launcher_lookup.py
          if ($LASTEXITCODE -ne 0) { throw "Falha no helper Consulta DANFE" }
          New-Item -ItemType Directory -Force -Path "installer-v2/payload/_internal/csm" | Out-Null
          $fx=Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319"
          $csc=Join-Path $fx "csc.exe"
          $source=(Resolve-Path "installer-v2/launcher/consulta_danfe_helper.cs").Path
          $helper=(Join-Path (Resolve-Path "installer-v2/payload/_internal/csm").Path "CSM Consulta DANFE Helper.exe")
          & $csc /nologo /target:winexe /optimize+ /platform:x64 "/out:$helper" "/reference:$(Join-Path $fx 'WPF\UIAutomationClient.dll')" "/reference:$(Join-Path $fx 'WPF\UIAutomationTypes.dll')" "/reference:$(Join-Path $fx 'System.Windows.Forms.dll')" $source
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $helper)) { throw "Helper Consulta DANFE não compilou" }
          if(Get-ChildItem "installer-v2/payload/_internal/csm" -Filter *.ps1 -ErrorAction SilentlyContinue){throw "Payload contém PowerShell indevido"}

          $original="installer-v2/payload/CSM Visualizador XML.exe"
          $core="installer-v2/payload/CSM Visualizador XML Core.exe"
          $icon=(Resolve-Path "installer-v2/payload/_internal/assets/CSMVisualizadorXML.ico").Path
          Move-Item -Force $original $core
          go install github.com/akavel/rsrc@v0.10.2
          if ($LASTEXITCODE -ne 0) { throw "Falha no rsrc" }
          $rsrc=Join-Path (go env GOPATH) "bin\rsrc.exe"
          & $rsrc -arch amd64 -ico $icon -o "installer-v2/launcher/rsrc_windows_amd64.syso"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao embutir logo" }
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0';$env:GO111MODULE='off'
          Push-Location installer-v2/launcher
          try { go build -trimpath -ldflags="-H windowsgui -s -w" -o "..\payload\CSM Visualizador XML.exe" .; if($LASTEXITCODE -ne 0){throw "Launcher não compilou"} } finally { Pop-Location }
          if(!(Test-Path $core)){throw "Core original ausente"}
          Add-Type -AssemblyName System.Drawing
          $ico=[System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "installer-v2/payload/CSM Visualizador XML.exe").Path)
          if($null -eq $ico -or $ico.Width -lt 16){throw "Launcher sem ícone"};$ico.Dispose()
          $self=Start-Process "installer-v2/payload/CSM Visualizador XML.exe" -ArgumentList '--csm-launcher-selftest' -Wait -PassThru
          if($self.ExitCode -ne 0){throw "Self-test launcher falhou"}

      - name: Preparar instalador profissional 3.9.1
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python installer-v2/make_brand.py
          if ($LASTEXITCODE -ne 0) { throw "Falha na identidade visual" }
          python installer-v2/prepare_release_391.py
          if ($LASTEXITCODE -ne 0) { throw "Falha no release 3.9.1" }
          $path="installer-v2/CSMVisualizadorXML.iss"
          $text=Get-Content $path -Raw
          $text=[regex]::Replace($text,'(?m)^UninstallDisplayVersion=.*\r?\n','')
          [IO.File]::WriteAllText((Resolve-Path $path),$text,[Text.UTF8Encoding]::new($false))
          $iss=Get-Content $path -Raw
          foreach($token in @('AppVersion "3.9.1"','PrivilegesRequired=lowest','BrazilianPortuguese.isl','Entender a Tributação','Motor Fiscal de Devolução','ApplicationIcon','DefaultIcon')){if(!$iss.Contains($token)){throw "ISS incompleto: $token"}}
          if($iss.Contains('PrivilegesRequired=admin')){throw "Instalador ainda pede administrador"}

      - name: Compilar instalador completo
        shell: pwsh
        run: |
          $iscc="C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if(!(Test-Path $iscc)){choco install innosetup -y --no-progress}
          if(!(Test-Path $iscc)){throw "Inno Setup ausente"}
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "installer-v2/CSMVisualizadorXML.iss"
          if($LASTEXITCODE -ne 0){throw "Compilação do instalador falhou"}
          $base="dist/CSMVisualizadorXML-3.9.1-Instalador-Completo.exe"
          if(!(Test-Path $base)){throw "EXE final não gerado"}
          Copy-Item $base "dist/CSM Visualizador XML 3.9.1 - Instalador Completo.exe" -Force
          Copy-Item $base "dist/CSMVisualizadorXML-Instalador-Completo-Abas-Fix.exe" -Force
          if((Get-Item $base).VersionInfo.ProductVersion -notlike '3.9.1*'){throw "ProductVersion incorreto"}

      - name: Homologar instalação em máquina limpa
        shell: pwsh
        run: |
          $installer=(Resolve-Path "dist/CSM Visualizador XML 3.9.1 - Instalador Completo.exe").Path
          $dir=Join-Path $env:TEMP "CSM-391-Maquina-Limpa"
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          $p=Start-Process $installer -ArgumentList ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="'+$dir+'"') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Instalação limpa falhou"}
          $info=Join-Path $dir "_internal\csm\build-info.json";$app=Join-Path $dir "_internal\web\app.js"
          if(!(Test-Path $info) -or !(Test-Path $app)){throw "Payload instalado incompleto"}
          $bi=Get-Content $info -Raw|ConvertFrom-Json
          if($bi.version -ne '3.9.1' -or $bi.motor_devolucao -ne '1.3.0' -or $bi.entender_tributacao -ne '1.0.1' -or !$bi.tax_no_freeze_fix){throw "Máquina limpa recebeu pacote errado"}
          foreach($token in @('CSM_DEVOLUTION_ENTRYPOINT_V4','Criar modelo de devolução','CSM_TAX_ENGINE_V1','CSM_TAX_EXPLAINER_UI_V1','CSM_TAX_EXPLAINER_NO_FREEZE_391','Entender a Tributação','CSM_RELEASE_IDENTITY_3_9_1')){if(!(Select-String -Path $app -Pattern $token -SimpleMatch -Quiet)){throw "Instalado sem $token"}}
          if(Select-String -Path $app -Pattern "if(eligible&&activeView==='taxexplain')csmTaxRenderCurrent();return true}" -SimpleMatch -Quiet){throw "Instalação final ainda contém loop da 3.9.0"}
          $txt=Get-Content $app -Raw -Encoding UTF8
          if(([regex]::Matches($txt,[regex]::Escape("els.aboutVersion.textContent='Versão 3.9.1'"))).Count -lt 2){throw "Sobre não mostra 3.9.1"}
          $un=Join-Path $dir 'unins000.exe';if(Test-Path $un){Start-Process $un -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait}

      - name: Homologar limpeza e associação XML
        shell: pwsh
        run: |
          $src=Get-Content "installer-v2/test_clean_association.ps1" -Raw -Encoding UTF8
          $src=$src.Replace('3.8.0','3.9.1').Replace('3.8.1','3.9.1').Replace('3.9.0','3.9.1')
          $script=Join-Path (Resolve-Path temp) 'test_clean_391.ps1'
          [IO.File]::WriteAllText($script,$src,[Text.UTF8Encoding]::new($false))
          & $script

      - name: Homologar abas launcher e desinstalação
        shell: pwsh
        run: ./installer-v2/test_installed.ps1

      - name: Validação final do payload
        timeout-minutes: 3
        shell: pwsh
        run: |
          node installer-v2/test_devolution_engine_v3.js
          if($LASTEXITCODE -ne 0){throw "Motor de Devolução final falhou"}
          node installer-v2/test_devolution_entrypoint_v4.js
          if($LASTEXITCODE -ne 0){throw "Entrada da Devolução falhou"}
          $env:CSM_TAX_CORE=(Resolve-Path "temp/taxsrc/tax_engine_core.js").Path
          $env:CSM_TAX_UI=(Resolve-Path "temp/taxsrc/tax_explainer_ui.js").Path
          node installer-v2/test_tax_engine.js
          if($LASTEXITCODE -ne 0){throw "Motor tributário final falhou"}
          node installer-v2/test_tax_ui.js
          if($LASTEXITCODE -ne 0){throw "UI tributária final falhou ou congelou"}
          Copy-Item "installer-v2/payload/_internal/web/app.js" "temp/app-final-391.mjs" -Force
          node --check "temp/app-final-391.mjs"
          if($LASTEXITCODE -ne 0){throw "app.js final inválido"}

      - name: Gerar checksum
        shell: pwsh
        run: |
          $exe="dist/CSM Visualizador XML 3.9.1 - Instalador Completo.exe"
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  CSM Visualizador XML 3.9.1 - Instalador Completo.exe" | Set-Content -Encoding ascii "dist/CSM Visualizador XML 3.9.1 - SHA256.txt"
          Write-Host "SHA256=$sha"

      - name: Publicar instalador homologado
        uses: actions/upload-artifact@v4
        with:
          name: CSMVisualizadorXML-3.9.1-Instalador-Final
          path: |
            dist/CSM Visualizador XML 3.9.1 - Instalador Completo.exe
            dist/CSM Visualizador XML 3.9.1 - SHA256.txt
          if-no-files-found: error
          retention-days: 30
