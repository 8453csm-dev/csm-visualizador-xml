name: Build CSM Visualizador XML 3.9.2 Final

on:
  push:
    branches: ["release/3.9.2"]
    paths:
      - "installer-v2/**"
      - ".github/workflows/build-3.9.2-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Baixar base estavel 3.7.8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          gh release download v3.7.8 --repo 8453csm-dev/csm-visualizador-xml --pattern "CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" --dir temp

      - name: Montar payload completo 3.9.2
        shell: pwsh
        run: |
          python installer-v2/extract_payload.py "temp/CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" "installer-completo/enhancer_v8.html" "installer-v2/payload"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao extrair base" }
          python installer-v2/patch_runtime.py "installer-v2/payload/_internal/web"
          python installer-v2/patch_lookup_order.py
          python installer-v2/patch_devolution_engine.py "installer-v2/payload/_internal/web"
          python installer-v2/patch_tax_explainer.py "installer-v2/payload/_internal/web"
          python installer-v2/patch_tax_explainer_entrypoint_v2.py "installer-v2/payload/_internal/web"
          python installer-v2/patch_release_identity_392.py "installer-v2/payload/_internal/web" "installer-v2/payload/_internal/csm"
          python installer-v2/patch_tax_explainer.py --extract temp/taxsrc
          Copy-Item installer-v2/tax_explainer_entrypoint_v2.js temp/taxsrc/tax_explainer_entrypoint_v2.js -Force
          $app="installer-v2/payload/_internal/web/app.js"
          Copy-Item $app temp/app-392.mjs -Force
          node --check temp/app-392.mjs
          if($LASTEXITCODE -ne 0){throw "app.js final invalido"}
          foreach($token in @('CSM_DEVOLUTION_ENTRYPOINT_V4','Criar modelo de devolução','CSM_TAX_ENGINE_V1','CSM_TAX_EXPLAINER_UI_V1','CSM_TAX_EXPLAINER_ENTRYPOINT_V2','Entender a Tributação','CSM_RELEASE_IDENTITY_3_9_2')){if(!(Select-String -Path $app -Pattern $token -SimpleMatch -Quiet)){throw "Componente ausente: $token"}}
          $bi=Get-Content "installer-v2/payload/_internal/csm/build-info.json" -Raw|ConvertFrom-Json
          if($bi.version -ne '3.9.2' -or $bi.entender_tributacao -ne '1.0.2' -or !$bi.tax_entry_activate_document -or !$bi.tax_no_mutation_render_loop){throw "Build-info 3.9.2 incorreto"}

      - name: Testar Devolucao e Tributacao em estrutura real
        shell: pwsh
        run: |
          npm install --no-save jsdom@26.1.0
          node installer-v2/test_devolution_engine.js
          if($LASTEXITCODE -ne 0){throw "Devolucao base regrediu"}
          node installer-v2/test_devolution_engine_v3.js
          if($LASTEXITCODE -ne 0){throw "Devolucao ICMS-ST/PDF regrediu"}
          node installer-v2/test_devolution_entrypoint_v4.js
          if($LASTEXITCODE -ne 0){throw "Entrada da Devolucao regrediu"}
          $env:CSM_TAX_CORE=(Resolve-Path temp/taxsrc/tax_engine_core.js).Path
          $env:CSM_TAX_UI=(Resolve-Path temp/taxsrc/tax_explainer_ui.js).Path
          $env:CSM_TAX_ENTRY=(Resolve-Path temp/taxsrc/tax_explainer_entrypoint_v2.js).Path
          node installer-v2/test_tax_engine.js
          if($LASTEXITCODE -ne 0){throw "Motor tributario falhou"}
          node installer-v2/test_tax_ui.js
          if($LASTEXITCODE -ne 0){throw "Montagem tributaria falhou"}
          node installer-v2/test_tax_no_freeze.js
          if($LASTEXITCODE -ne 0){throw "Loop/congelamento tributario voltou"}
          node installer-v2/test_tax_entrypoint_v2.js
          if($LASTEXITCODE -ne 0){throw "Aba tributaria nao acompanha primeira NF-e/programmatic activateDocument"}

      - name: Preparar launcher e Consulta DANFE
        shell: pwsh
        run: |
          python installer-v2/patch_launcher_single_instance.py
          python installer-v2/patch_launcher_lookup.py
          New-Item -ItemType Directory -Force -Path "installer-v2/payload/_internal/csm" | Out-Null
          $fx=Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319";$csc=Join-Path $fx "csc.exe"
          $source=(Resolve-Path "installer-v2/launcher/consulta_danfe_helper.cs").Path;$helper=(Join-Path (Resolve-Path "installer-v2/payload/_internal/csm").Path "CSM Consulta DANFE Helper.exe")
          & $csc /nologo /target:winexe /optimize+ /platform:x64 "/out:$helper" "/reference:$(Join-Path $fx 'WPF\UIAutomationClient.dll')" "/reference:$(Join-Path $fx 'WPF\UIAutomationTypes.dll')" "/reference:$(Join-Path $fx 'System.Windows.Forms.dll')" $source
          if($LASTEXITCODE -ne 0 -or !(Test-Path $helper)){throw "Helper nao compilou"}
          $original="installer-v2/payload/CSM Visualizador XML.exe";$core="installer-v2/payload/CSM Visualizador XML Core.exe";$icon=(Resolve-Path "installer-v2/payload/_internal/assets/CSMVisualizadorXML.ico").Path
          Move-Item -Force $original $core
          go install github.com/akavel/rsrc@v0.10.2
          $rsrc=Join-Path (go env GOPATH) "bin\rsrc.exe";& $rsrc -arch amd64 -ico $icon -o "installer-v2/launcher/rsrc_windows_amd64.syso"
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0';$env:GO111MODULE='off'
          Push-Location installer-v2/launcher; try{go build -trimpath -ldflags="-H windowsgui -s -w" -o "..\payload\CSM Visualizador XML.exe" .;if($LASTEXITCODE -ne 0){throw "Launcher nao compilou"}}finally{Pop-Location}
          $self=Start-Process "installer-v2/payload/CSM Visualizador XML.exe" -ArgumentList '--csm-launcher-selftest' -Wait -PassThru;if($self.ExitCode -ne 0){throw "Self-test launcher falhou"}

      - name: Preparar instalador 3.9.2
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python installer-v2/make_brand.py
          python installer-v2/prepare_release_392.py
          $path="installer-v2/CSMVisualizadorXML.iss";$text=Get-Content $path -Raw;$text=[regex]::Replace($text,'(?m)^UninstallDisplayVersion=.*\r?\n','');[IO.File]::WriteAllText((Resolve-Path $path),$text,[Text.UTF8Encoding]::new($false))
          $iss=Get-Content $path -Raw
          foreach($token in @('AppVersion "3.9.2"','PrivilegesRequired=lowest','BrazilianPortuguese.isl','Entender a Tributação','Motor Fiscal de Devolução','ApplicationIcon','DefaultIcon')){if(!$iss.Contains($token)){throw "ISS incompleto: $token"}}

      - name: Compilar instalador completo
        shell: pwsh
        run: |
          $iscc="C:\Program Files (x86)\Inno Setup 6\ISCC.exe";if(!(Test-Path $iscc)){choco install innosetup -y --no-progress};if(!(Test-Path $iscc)){throw "Inno ausente"}
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "installer-v2/CSMVisualizadorXML.iss";if($LASTEXITCODE -ne 0){throw "Compilacao falhou"}
          $base="dist/CSMVisualizadorXML-3.9.2-Instalador-Completo.exe";if(!(Test-Path $base)){throw "EXE nao gerado"}
          Copy-Item $base "dist/CSM Visualizador XML 3.9.2 - Instalador Completo.exe" -Force
          Copy-Item $base "dist/CSMVisualizadorXML-Instalador-Completo-Abas-Fix.exe" -Force

      - name: Homologar instalacao limpa
        shell: pwsh
        run: |
          $installer=(Resolve-Path "dist/CSM Visualizador XML 3.9.2 - Instalador Completo.exe").Path;$dir=Join-Path $env:TEMP "CSM-392-Maquina-Limpa";Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          $p=Start-Process $installer -ArgumentList ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="'+$dir+'"') -Wait -PassThru;if($p.ExitCode -ne 0){throw "Instalacao limpa falhou"}
          $info=Join-Path $dir "_internal\csm\build-info.json";$app=Join-Path $dir "_internal\web\app.js";if(!(Test-Path $info)-or!(Test-Path $app)){throw "Payload incompleto"}
          $bi=Get-Content $info -Raw|ConvertFrom-Json;if($bi.version -ne '3.9.2' -or !$bi.tax_entry_activate_document){throw "Maquina limpa recebeu pacote errado"}
          foreach($token in @('CSM_TAX_EXPLAINER_ENTRYPOINT_V2','activateDocument=async function','Criar modelo de devolução')){if(!(Select-String -Path $app -Pattern $token -SimpleMatch -Quiet)){throw "Instalado sem $token"}}
          $un=Join-Path $dir 'unins000.exe';if(Test-Path $un){Start-Process $un -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait}

      - name: Homologar limpeza associacao abas e desinstalacao
        shell: pwsh
        run: |
          $src=Get-Content "installer-v2/test_clean_association.ps1" -Raw -Encoding UTF8;$src=$src.Replace('3.8.0','3.9.2').Replace('3.8.1','3.9.2').Replace('3.9.0','3.9.2').Replace('3.9.1','3.9.2');$script=Join-Path (Resolve-Path temp) 'test_clean_392.ps1';[IO.File]::WriteAllText($script,$src,[Text.UTF8Encoding]::new($false)); & $script
          ./installer-v2/test_installed.ps1

      - name: Validacao final
        shell: pwsh
        run: |
          $env:CSM_TAX_CORE=(Resolve-Path temp/taxsrc/tax_engine_core.js).Path;$env:CSM_TAX_UI=(Resolve-Path temp/taxsrc/tax_explainer_ui.js).Path;$env:CSM_TAX_ENTRY=(Resolve-Path temp/taxsrc/tax_explainer_entrypoint_v2.js).Path
          node installer-v2/test_tax_entrypoint_v2.js;if($LASTEXITCODE -ne 0){throw "Entrada tributaria final falhou"}
          node installer-v2/test_tax_no_freeze.js;if($LASTEXITCODE -ne 0){throw "No-freeze final falhou"}
          node installer-v2/test_devolution_entrypoint_v4.js;if($LASTEXITCODE -ne 0){throw "Devolucao final falhou"}
          Copy-Item "installer-v2/payload/_internal/web/app.js" temp/app-final-392.mjs -Force;node --check temp/app-final-392.mjs;if($LASTEXITCODE -ne 0){throw "app final invalido"}

      - name: Gerar checksum
        shell: pwsh
        run: |
          $exe="dist/CSM Visualizador XML 3.9.2 - Instalador Completo.exe";$sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower();"$sha  CSM Visualizador XML 3.9.2 - Instalador Completo.exe" | Set-Content -Encoding ascii "dist/CSM Visualizador XML 3.9.2 - SHA256.txt";Write-Host "SHA256=$sha"

      - name: Publicar instalador homologado
        uses: actions/upload-artifact@v4
        with:
          name: CSMVisualizadorXML-3.9.2-Instalador-Final
          path: |
            dist/CSM Visualizador XML 3.9.2 - Instalador Completo.exe
            dist/CSM Visualizador XML 3.9.2 - SHA256.txt
          if-no-files-found: error
          retention-days: 30
