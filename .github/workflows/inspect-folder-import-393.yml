name: Inspect Folder Import 3.9.3

on:
  workflow_dispatch:
  push:
    branches: ["release/3.9.3"]
    paths:
      - ".github/workflows/inspect-folder-import-393.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar base 3.7.8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          gh release download v3.7.8 --repo 8453csm-dev/csm-visualizador-xml --pattern "CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" --dir temp
      - name: Extrair e aplicar runtime atual
        shell: pwsh
        run: |
          python installer-v2/extract_payload.py "temp/CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" "installer-completo/enhancer_v8.html" "temp/payload"
          python installer-v2/patch_runtime.py "temp/payload/_internal/web"
          $app="temp/payload/_internal/web/app.js"
          python -c "from pathlib import Path; p=Path(r'$app'); t=p.read_text(encoding='utf-8'); keys=['5000','folder','pasta','open_folder','choose_folder','select_folder','Abrir pasta','import']; lines=t.splitlines(); print('TOTAL LINES',len(lines)); [(print(f'--- {i+1} ---\\n'+ '\\n'.join(lines[max(0,i-4):min(len(lines),i+5)]))) for i,l in enumerate(lines) if any(k.lower() in l.lower() for k in keys)]"
