name: Build CSM Visualizador XML 3.8.1 Completo

on:
  push:
    branches: ["release/3.8.1"]
    paths:
      - "installer-v2/**"
      - ".github/workflows/build-3.8.1-completo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Baixar base estável 3.7.8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          gh release download v3.7.8 `
            --repo 8453csm-dev/csm-visualizador-xml `
            --pattern "CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" `
            --dir temp

      - name: Montar payload completo 3.8.1
        shell: pwsh
        run: |
          python installer-v2/extract_payload.py `
            "temp/CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" `
            "installer-completo/enhancer_v8.html" `
            "installer-v2/payload"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao extrair base estável" }

          python installer-v2/patch_runtime.py "installer-v2/payload/_internal/web"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao aplicar runtime validado" }
          python installer-v2/patch_lookup_order.py
          if ($LASTEXITCODE -ne 0) { throw "Falha ao aplicar Localizador" }
          python installer-v2/patch_devolution_engine.py "installer-v2/payload/_internal/web"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao aplicar Motor Fiscal" }
          python installer-v2/patch_release_identity.py `
            "installer-v2/payload/_internal/web" `
            "installer-v2/payload/_internal/csm"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao aplicar identidade 3.8.1" }

          node installer-v2/test_devolution_engine.js
          if ($LASTEXITCODE -ne 0) { throw "Teste fiscal base falhou" }
          node installer-v2/test_devolution_engine_v3.js
          if ($LASTEXITCODE -ne 0) { throw "Teste Motor Fiscal tributário falhou" }
          node --check installer-v2/devolution_engine_v3_patch.js
          if ($LASTEXITCODE -ne 0) { throw "JavaScript V3 inválido" }
          node --check installer-v2/devolution_entrypoint_v4_patch.js
          if ($LASTEXITCODE -ne 0) { throw "JavaScript de entrada V4 inválido" }

          $app = "installer-v2/payload/_internal/web/app.js"
          Copy-Item -Force $app "temp/csm-app-3.8.1.mjs"
          node --check "temp/csm-app-3.8.1.mjs"
          if ($LASTEXITCODE -ne 0) { throw "app.js final inválido como ES module" }

          foreach($token in @(
            "CSM_MULTI_TAB_BRIDGE_V1",
            "CSM_LOCATOR_FIX_V1",
            "CSM_DEVOLUTION_ENGINE_V1",
            "CSM_DEVOLUTION_ENGINE_V2",
            "CSM_DEVOLUTION_ENGINE_V3",
            "CSM_DEVOLUTION_ENTRYPOINT_V4",
            "CSM_RELEASE_IDENTITY_3_8_1",
            "Criar modelo de devolução",
            "entrypointVersion=CSM_DEV_ENTRYPOINT_VERSION",
            "Usar campo próprio VALOR DO ICMS-ST",
            "Emissor não aceita ST: usar OUTRAS DESPESAS",
            "prod-detail"
          )) {
            if (!(Select-String -Path $app -Pattern $token -SimpleMatch -Quiet)) { throw "Componente obrigatório ausente: $token" }
          }
          $buildInfo = "installer-v2/payload/_internal/csm/build-info.json"
          if (!(Test-Path $buildInfo)) { throw "build-info.json ausente" }
          $bi = Get-Content $buildInfo -Raw | ConvertFrom-Json
          if ($bi.version -ne "3.8.1" -or $bi.motor_devolucao -ne "1.3.0" -or !$bi.entrypoint_deterministic) { throw "Identidade do build incorreta" }

      - name: Testar Motor Fiscal em máquina rápida e lenta
        shell: pwsh
        run: |
          npm install --no-save jsdom@26.1.0
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar ambiente de teste DOM" }
          node installer-v2/test_devolution_entrypoint_v4.js
          if ($LASTEXITCODE -ne 0) { throw "Motor Fiscal ainda depende de timing da máquina" }

      - name: Aplicar instância única estrita
        shell: pwsh
        run: |
          python installer-v2/patch_launcher_single_instance.py
          if ($LASTEXITCODE -ne 0) { throw "Falha ao aplicar instância única" }
          if (!(Select-String -Path "installer-v2/launcher/main.go" -Pattern "CSM_SINGLE_INSTANCE_STRICT_V2" -Quiet)) { throw "Instância única não aplicada" }

      - name: Compilar helper Windows Consulta DANFE
        shell: pwsh
        run: |
          python installer-v2/patch_launcher_lookup.py
          if ($LASTEXITCODE -ne 0) { throw "Falha ao preparar helper Consulta DANFE" }
          New-Item -ItemType Directory -Force -Path "installer-v2/payload/_internal/csm" | Out-Null
          $fx = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319"
          $csc = Join-Path $fx "csc.exe"
          $uiaClient = Join-Path $fx "WPF\UIAutomationClient.dll"
          $uiaTypes = Join-Path $fx "WPF\UIAutomationTypes.dll"
          $forms = Join-Path $fx "System.Windows.Forms.dll"
          $source = (Resolve-Path "installer-v2/launcher/consulta_danfe_helper.cs").Path
          $helperOut = Join-Path (Resolve-Path "installer-v2/payload/_internal/csm").Path "CSM Consulta DANFE Helper.exe"
          & $csc /nologo /target:winexe /optimize+ /platform:x64 `
            "/out:$helperOut" `
            "/reference:$uiaClient" "/reference:$uiaTypes" "/reference:$forms" `
            $source
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $helperOut)) { throw "Falha ao compilar helper Consulta DANFE" }
          if (Get-ChildItem "installer-v2/payload/_internal/csm" -Filter *.ps1 -ErrorAction SilentlyContinue) { throw "Payload contém PowerShell indevido" }

      - name: Compilar launcher com logo embutida
        shell: pwsh
        run: |
          $original = "installer-v2/payload/CSM Visualizador XML.exe"
          $core = "installer-v2/payload/CSM Visualizador XML Core.exe"
          $icon = (Resolve-Path "installer-v2/payload/_internal/assets/CSMVisualizadorXML.ico").Path
          Move-Item -Force $original $core
          go install github.com/akavel/rsrc@v0.10.2
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar gerador de recurso" }
          $rsrc = Join-Path (go env GOPATH) "bin\rsrc.exe"
          & $rsrc -arch amd64 -ico $icon -o "installer-v2/launcher/rsrc_windows_amd64.syso"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao embutir logo CSM" }
          $env:GOOS = "windows"; $env:GOARCH = "amd64"; $env:CGO_ENABLED = "0"; $env:GO111MODULE = "off"
          Push-Location "installer-v2/launcher"
          try {
            go build -trimpath -ldflags="-H windowsgui -s -w" -o "..\payload\CSM Visualizador XML.exe" .
            if ($LASTEXITCODE -ne 0) { throw "Compilação do launcher falhou" }
          } finally { Pop-Location }
          if (!(Test-Path "installer-v2/payload/CSM Visualizador XML.exe") -or !(Test-Path $core)) { throw "Launcher/Core incompletos" }
          Add-Type -AssemblyName System.Drawing
          $embeddedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "installer-v2/payload/CSM Visualizador XML.exe").Path)
          if ($null -eq $embeddedIcon -or $embeddedIcon.Width -lt 16) { throw "Launcher sem ícone embutido" }
          $embeddedIcon.Dispose()
          $self = Start-Process -FilePath "installer-v2/payload/CSM Visualizador XML.exe" -ArgumentList '--csm-launcher-selftest' -Wait -PassThru
          if ($self.ExitCode -ne 0) { throw "Self-test do launcher falhou" }

      - name: Gerar identidade visual do instalador
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python installer-v2/make_brand.py
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar identidade visual" }

      - name: Preparar instalador 3.8.1 por usuário
        shell: pwsh
        run: |
          python installer-v2/prepare_release_381.py
          if ($LASTEXITCODE -ne 0) { throw "Falha ao preparar release 3.8.1" }
          $path = "installer-v2/CSMVisualizadorXML.iss"
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, '(?m)^UninstallDisplayVersion=.*\r?\n', '')
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          $iss = Get-Content $path -Raw
          foreach($token in @('AppVersion "3.8.1"','PrivilegesRequired=lowest','BrazilianPortuguese.isl','NOVIDADES DESTA VERSÃO','Motor Fiscal de Devolução','ApplicationIcon','DefaultIcon')) {
            if(!$iss.Contains($token)) { throw "Instalador 3.8.1 incompleto: $token" }
          }
          if($iss.Contains('PrivilegesRequired=admin')) { throw "Release ainda depende de administrador" }

      - name: Instalar Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "ISCC.exe não encontrado" }

      - name: Compilar instalador completo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer-v2/CSMVisualizadorXML.iss"
          if ($LASTEXITCODE -ne 0) { throw "Compilação Inno Setup falhou" }
          $base = "dist/CSMVisualizadorXML-3.8.1-Instalador-Completo.exe"
          if (!(Test-Path $base)) { throw "Instalador 3.8.1 não gerado" }
          Copy-Item -Force $base "dist/CSM Visualizador XML 3.8.1 - Instalador Completo.exe"
          Copy-Item -Force $base "dist/CSMVisualizadorXML-Instalador-Completo-Abas-Fix.exe"
          $vi=(Get-Item $base).VersionInfo
          if($vi.ProductVersion -notlike '3.8.1*') { throw "ProductVersion incorreto: $($vi.ProductVersion)" }

      - name: Testar instalação limpa em perfil novo
        shell: pwsh
        run: |
          $installer=(Resolve-Path "dist/CSM Visualizador XML 3.8.1 - Instalador Completo.exe").Path
          $dir=Join-Path $env:TEMP "CSM-381-Fresh-Machine"
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          $p=Start-Process $installer -ArgumentList ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="'+$dir+'"') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Instalação limpa falhou"}
          $info=Join-Path $dir "_internal\csm\build-info.json"
          $app=Join-Path $dir "_internal\web\app.js"
          $bi=Get-Content $info -Raw|ConvertFrom-Json
          if($bi.version -ne '3.8.1' -or $bi.motor_devolucao -ne '1.3.0' -or !$bi.entrypoint_deterministic){throw "Máquina limpa recebeu build errado"}
          foreach($token in @('CSM_DEVOLUTION_ENGINE_V3','CSM_DEVOLUTION_ENTRYPOINT_V4','CSM_RELEASE_IDENTITY_3_8_1','Criar modelo de devolução')){
            if(!(Select-String -Path $app -Pattern $token -SimpleMatch -Quiet)){throw "Instalação limpa sem $token"}
          }
          $about=(Get-Content $app -Raw -Encoding UTF8)
          if(([regex]::Matches($about,[regex]::Escape("els.aboutVersion.textContent='Versão 3.8.1'"))).Count -lt 2){throw "Sobre não está fixado em 3.8.1"}
          $un=Join-Path $dir "unins000.exe"
          if(Test-Path $un){Start-Process $un -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait}

      - name: Teste de limpeza e associação XML 3.8.1
        shell: pwsh
        run: |
          $src=Get-Content "installer-v2/test_clean_association.ps1" -Raw -Encoding UTF8
          $src=$src.Replace('3.8.0','3.8.1')
          [IO.File]::WriteAllText((Join-Path (Resolve-Path temp) 'test_clean_381.ps1'),$src,[Text.UTF8Encoding]::new($false))
          & (Join-Path (Resolve-Path temp) 'test_clean_381.ps1')
          if($LASTEXITCODE -ne 0){throw "Teste de limpeza/associação falhou"}

      - name: Teste real de instalação abas e desinstalação
        shell: pwsh
        run: ./installer-v2/test_installed.ps1

      - name: Validar payload final novamente
        shell: pwsh
        run: |
          node installer-v2/test_devolution_engine_v3.js
          if ($LASTEXITCODE -ne 0) { throw "Motor Fiscal tributário falhou na validação final" }
          node installer-v2/test_devolution_entrypoint_v4.js
          if ($LASTEXITCODE -ne 0) { throw "Entrada do Motor Fiscal falhou na validação final" }
          $app = "installer-v2/payload/_internal/web/app.js"
          Copy-Item -Force $app "temp/csm-app-final-3.8.1.mjs"
          node --check "temp/csm-app-final-3.8.1.mjs"
          if ($LASTEXITCODE -ne 0) { throw "app.js final deixou de ser módulo ES válido" }

      - name: Gerar checksum
        shell: pwsh
        run: |
          $exe = "dist/CSM Visualizador XML 3.8.1 - Instalador Completo.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  CSM Visualizador XML 3.8.1 - Instalador Completo.exe" | Set-Content -Encoding ascii "dist/CSM Visualizador XML 3.8.1 - SHA256.txt"
          Write-Host "SHA256=$sha"

      - name: Publicar artefato 3.8.1 completo
        uses: actions/upload-artifact@v4
        with:
          name: CSMVisualizadorXML-3.8.1-Instalador-Completo
          path: |
            dist/CSM Visualizador XML 3.8.1 - Instalador Completo.exe
            dist/CSM Visualizador XML 3.8.1 - SHA256.txt
          if-no-files-found: error
          retention-days: 30
