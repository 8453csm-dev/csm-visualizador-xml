name: Diagnostico Tributacao 3.9.1

on:
  push:
    branches: ["release/3.9.1"]
    paths:
      - "installer-v2/**"
      - ".github/workflows/diagnostico-tax-391.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fontes do modulo
        run: |
          mkdir -p temp/tax-src
          python installer-v2/patch_tax_explainer.py --extract temp/tax-src
          node --check temp/tax-src/tax_engine_core.js
          node --check temp/tax-src/tax_explainer_ui.js
          grep -nE "MutationObserver|while\s*\(|for\s*\(;;|setInterval|requestAnimationFrame|innerHTML|get_xml_text|querySelectorAll" temp/tax-src/tax_explainer_ui.js > temp/tax-src/suspicious.txt || true
      - name: Publicar fontes para diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: tax-src-391
          path: temp/tax-src
          retention-days: 1
