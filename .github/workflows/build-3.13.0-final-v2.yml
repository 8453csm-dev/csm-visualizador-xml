name: Build CSM Visualizador XML 3.13.0 Final v2

on:
  push:
    branches: ["feature/nfe-certificados-integrados"]
    paths:
      - "installer-v2/**"
      - ".github/workflows/build-3.13.0-final-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Baixar base estável 3.7.8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          gh release download v3.7.8 --repo 8453csm-dev/csm-visualizador-xml --pattern "CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" --dir temp
          if($LASTEXITCODE -ne 0){throw "Falha ao baixar base 3.7.8"}

      - name: Montar payload completo 3.13.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python installer-v2/extract_payload.py "temp/CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" "installer-completo/enhancer_v8.html" "installer-v2/payload"; if($LASTEXITCODE){throw "extract_payload"}
          python installer-v2/patch_runtime.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "patch_runtime"}
          python installer-v2/patch_lookup_order.py; if($LASTEXITCODE){throw "lookup_order"}
          python installer-v2/patch_devolution_engine.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "devolution"}
          python installer-v2/patch_tax_explainer.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "tax"}
          python installer-v2/patch_tax_explainer_entrypoint_v2.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "tax entry"}
          python installer-v2/patch_difal_st.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "difal"}
          python installer-v2/patch_difal_display_3102.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "difal display"}
          python installer-v2/patch_folder_import_progress.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "folder progress 1"}
          python installer-v2/patch_folder_import_progress_v2.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "folder progress 2"}
          python installer-v2/patch_folder_import_progress_v3.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "folder progress 3"}
          python installer-v2/patch_native_lookup_action_3111.py; if($LASTEXITCODE){throw "lookup action"}
          python installer-v2/patch_native_lookup_3110.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "lookup native"}
          python installer-v2/patch_native_lookup_visibility_3113.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "lookup visibility"}
          python installer-v2/patch_lookup_status_toast_3112.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "lookup status"}
          python installer-v2/patch_native_lookup_core_3114.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "lookup core"}
          python installer-v2/patch_release_identity_3114.py "installer-v2/payload/_internal/web" "installer-v2/payload/_internal/csm"; if($LASTEXITCODE){throw "identity 3114"}
          python installer-v2/patch_lookup_embedded_3115.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "lookup 3115"}
          python installer-v2/patch_release_identity_3115.py "installer-v2/payload/_internal/web" "installer-v2/payload/_internal/csm"; if($LASTEXITCODE){throw "identity 3115"}
          python installer-v2/patch_native_fiscal_core_3120.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "native fiscal 3120"}
          python installer-v2/patch_release_identity_3120.py "installer-v2/payload/_internal/web" "installer-v2/payload/_internal/csm"; if($LASTEXITCODE){throw "identity 3120"}
          python installer-v2/patch_release_identity_3121.py "installer-v2/payload/_internal/web" "installer-v2/payload/_internal/csm"; if($LASTEXITCODE){throw "identity 3121"}
          python installer-v2/patch_native_nfe_workflow_3130_fixed.py "installer-v2/payload/_internal/web"; if($LASTEXITCODE){throw "frontend NF-e 3130"}
          python installer-v2/patch_release_identity_3130.py "installer-v2/payload/_internal/web" "installer-v2/payload/_internal/csm"; if($LASTEXITCODE){throw "identity 3130"}
          python installer-v2/patch_tax_explainer.py --extract temp/taxsrc; if($LASTEXITCODE){throw "tax extract"}
          Copy-Item installer-v2/tax_explainer_entrypoint_v2.js temp/taxsrc/tax_explainer_entrypoint_v2.js -Force
          Copy-Item (Resolve-Path "installer-v2/payload/_internal/web/app.js") temp/app-3130.mjs -Force
          node --check temp/app-3130.mjs; if($LASTEXITCODE){throw "app.js final inválido"}
          $bi=Get-Content "installer-v2/payload/_internal/csm/build-info.json" -Raw|ConvertFrom-Json
          if($bi.version -ne '3.13.0' -or !$bi.certificate_folder_manager -or !$bi.nfe_manifestacao_ciencia_210210 -or !$bi.nfe_xml_export_preserves_official_bytes -or $bi.native_key_lookup_browser_flow){throw "Build-info 3.13.0 incorreto"}

      - name: Testar interface e módulos fiscais
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --no-save jsdom@26.1.0; if($LASTEXITCODE){throw "npm"}
          $env:CSM_APP_JS=(Resolve-Path "installer-v2/payload/_internal/web/app.js").Path
          $env:CSM_CSS=(Resolve-Path "installer-v2/payload/_internal/web/refinement.css").Path
          node installer-v2/test_native_fiscal_core_3120.js; if($LASTEXITCODE){throw "native fiscal test"}
          node installer-v2/test_native_nfe_workflow_3130.js; if($LASTEXITCODE){throw "native nfe 3130 test"}
          node installer-v2/test_folder_import_progress_v3.js; if($LASTEXITCODE){throw "folder test"}
          node installer-v2/test_difal_st.js; if($LASTEXITCODE){throw "difal test"}
          node installer-v2/test_difal_display_3102.js; if($LASTEXITCODE){throw "difal display test"}
          node installer-v2/test_devolution_engine.js; if($LASTEXITCODE){throw "devolution test"}
          node installer-v2/test_devolution_engine_v3.js; if($LASTEXITCODE){throw "devolution v3"}
          node installer-v2/test_devolution_entrypoint_v4.js; if($LASTEXITCODE){throw "devolution v4"}
          $env:CSM_TAX_CORE=(Resolve-Path temp/taxsrc/tax_engine_core.js).Path
          $env:CSM_TAX_UI=(Resolve-Path temp/taxsrc/tax_explainer_ui.js).Path
          $env:CSM_TAX_ENTRY=(Resolve-Path temp/taxsrc/tax_explainer_entrypoint_v2.js).Path
          node installer-v2/test_tax_engine.js; if($LASTEXITCODE){throw "tax engine"}
          node installer-v2/test_tax_ui.js; if($LASTEXITCODE){throw "tax ui"}
          node installer-v2/test_tax_no_freeze.js; if($LASTEXITCODE){throw "tax freeze"}
          node installer-v2/test_tax_entrypoint_v2.js; if($LASTEXITCODE){throw "tax entry test"}

      - name: Preparar launcher e Fiscal Core 3.13.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python installer-v2/patch_launcher_single_instance.py; if($LASTEXITCODE){throw "launcher single"}
          python installer-v2/patch_launcher_lookup.py; if($LASTEXITCODE){throw "launcher lookup"}
          python installer-v2/patch_launcher_395.py; if($LASTEXITCODE){throw "launcher 395"}
          python installer-v2/patch_launcher_fresh_core_3102.py; if($LASTEXITCODE){throw "fresh core"}
          python installer-v2/patch_lookup_delivery_3112.py; if($LASTEXITCODE){throw "delivery"}
          python installer-v2/patch_lookup_save_dialog_3112.py; if($LASTEXITCODE){throw "save dialog"}
          python installer-v2/patch_lookup_status_tag_3112.py; if($LASTEXITCODE){throw "status tag"}
          python installer-v2/patch_lookup_dialog_3114.py; if($LASTEXITCODE){throw "lookup dialog"}
          python installer-v2/patch_lookup_hidden_window_3115.py; if($LASTEXITCODE){throw "hidden window"}
          python installer-v2/patch_launcher_postinstall_fresh_3112.py; if($LASTEXITCODE){throw "postinstall"}
          python installer-v2/patch_launcher_fiscal_core_3120.py; if($LASTEXITCODE){throw "broker fiscal"}
          python installer-v2/patch_launcher_cert_manager_3130.py; if($LASTEXITCODE){throw "broker cert"}
          python installer-v2/patch_launcher_manifestacao_3130.py; if($LASTEXITCODE){throw "broker manifest"}
          python installer-v2/patch_launcher_nfe_actions_3130.py; if($LASTEXITCODE){throw "broker nfe actions"}
          python installer-v2/test_launcher_cert_manager_3130.py; if($LASTEXITCODE){throw "broker test"}
          python installer-v2/patch_fiscal_core_3121.py; if($LASTEXITCODE){throw "core 3121"}
          python installer-v2/patch_fiscal_core_cert_manager_3130.py; if($LASTEXITCODE){throw "core cert"}
          python installer-v2/patch_cert_manager_paths_3130.py; if($LASTEXITCODE){throw "cert paths"}
          python installer-v2/patch_cert_manager_credential_manager_3130.py; if($LASTEXITCODE){throw "credential manager"}
          python installer-v2/patch_cert_manager_public_ids_3130.py; if($LASTEXITCODE){throw "public ids"}
          python installer-v2/patch_fiscal_core_manifestacao_3130.py; if($LASTEXITCODE){throw "core manifest"}
          python installer-v2/test_fiscal_core_soap_3121.py; if($LASTEXITCODE){throw "soap test"}
          python installer-v2/test_manifestacao_3130.py; if($LASTEXITCODE){throw "manifest test"}
          python installer-v2/test_cert_manager_3130.py; if($LASTEXITCODE){throw "cert manager test"}
          python installer-v2/test_cert_manager_security_3130.py; if($LASTEXITCODE){throw "cert security test"}
          Get-ChildItem installer-v2/launcher -Filter *.go | ForEach-Object { gofmt -w $_.FullName }
          New-Item -ItemType Directory -Force -Path "installer-v2/payload/_internal/csm" | Out-Null
          $fx=Join-Path $env:WINDIR "Microsoft.NET/Framework64/v4.0.30319";$csc=Join-Path $fx "csc.exe"
          $fiscalSource=(Resolve-Path "installer-v2/launcher/csm_fiscal_core.cs").Path
          $fiscal=(Join-Path (Resolve-Path "installer-v2/payload/_internal/csm").Path "CSM Fiscal Core.exe")
          & $csc /nologo /target:exe /optimize+ /platform:x64 "/out:$fiscal" "/reference:$(Join-Path $fx 'System.Web.Extensions.dll')" "/reference:$(Join-Path $fx 'System.Security.dll')" "/reference:$(Join-Path $fx 'System.Xml.dll')" "/reference:$(Join-Path $fx 'System.Xml.Linq.dll')" $fiscalSource
          if($LASTEXITCODE -ne 0 -or !(Test-Path $fiscal)){throw "CSM Fiscal Core 3.13.0 não compilou"}
          $fst=Start-Process $fiscal -ArgumentList 'selftest' -Wait -PassThru -WindowStyle Hidden
          if($fst.ExitCode -ne 0){throw "Self-test Fiscal Core falhou"}
          $legacySource=(Resolve-Path "installer-v2/launcher/consulta_danfe_helper.cs").Path
          $legacy=(Join-Path (Resolve-Path "installer-v2/payload/_internal/csm").Path "CSM Consulta DANFE Helper.exe")
          & $csc /nologo /target:winexe /optimize+ /platform:x64 "/out:$legacy" "/reference:$(Join-Path $fx 'WPF/UIAutomationClient.dll')" "/reference:$(Join-Path $fx 'WPF/UIAutomationTypes.dll')" "/reference:$(Join-Path $fx 'System.Windows.Forms.dll')" "/reference:$(Join-Path $fx 'System.Xml.Linq.dll')" $legacySource
          if($LASTEXITCODE){throw "Helper legado não compilou"}
          $original="installer-v2/payload/CSM Visualizador XML.exe";$core="installer-v2/payload/CSM Visualizador XML Core.exe";$icon=(Resolve-Path "installer-v2/payload/_internal/assets/CSMVisualizadorXML.ico").Path
          Move-Item -Force $original $core
          go install github.com/akavel/rsrc@v0.10.2; if($LASTEXITCODE){throw "rsrc install"}
          $rsrc=Join-Path (go env GOPATH) "bin/rsrc.exe";& $rsrc -arch amd64 -ico $icon -o "installer-v2/launcher/rsrc_windows_amd64.syso"; if($LASTEXITCODE){throw "rsrc"}
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0';$env:GO111MODULE='off'
          Push-Location installer-v2/launcher
          try{go build -trimpath -ldflags="-H windowsgui -s -w" -o "../payload/CSM Visualizador XML.exe" .;if($LASTEXITCODE){throw "Launcher não compilou"}}finally{Pop-Location}
          $self=Start-Process "installer-v2/payload/CSM Visualizador XML.exe" -ArgumentList '--csm-launcher-selftest' -Wait -PassThru
          if($self.ExitCode -ne 0){throw "Self-test launcher falhou"}

      - name: Compilar instalador 3.13.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check pillow
          python installer-v2/make_brand.py; if($LASTEXITCODE){throw "brand"}
          python installer-v2/prepare_release_3114.py; if($LASTEXITCODE){throw "prep 3114"}
          python installer-v2/prepare_release_3115.py; if($LASTEXITCODE){throw "prep 3115"}
          python installer-v2/prepare_release_3120.py; if($LASTEXITCODE){throw "prep 3120"}
          python installer-v2/prepare_release_3121.py; if($LASTEXITCODE){throw "prep 3121"}
          python installer-v2/prepare_release_3130.py; if($LASTEXITCODE){throw "prep 3130"}
          $path="installer-v2/CSMVisualizadorXML.iss";$text=Get-Content $path -Raw;$text=[regex]::Replace($text,'(?m)^UninstallDisplayVersion=.*\r?\n','');[IO.File]::WriteAllText((Resolve-Path $path),$text,[Text.UTF8Encoding]::new($false))
          $iscc="C:/Program Files (x86)/Inno Setup 6/ISCC.exe";if(!(Test-Path $iscc)){choco install innosetup -y --no-progress}
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "installer-v2/CSMVisualizadorXML.iss"
          if($LASTEXITCODE){throw "Compilação Inno falhou"}
          $base="dist/CSMVisualizadorXML-3.13.0-Instalador-Completo.exe";if(!(Test-Path $base)){throw "EXE não gerado"}
          Copy-Item $base "dist/CSM Visualizador XML 3.13.0 - Instalador Completo.exe" -Force

      - name: Homologar instalação limpa 3.13.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=(Resolve-Path "dist/CSM Visualizador XML 3.13.0 - Instalador Completo.exe").Path
          $dir=Join-Path $env:TEMP "CSM-3130-Maquina-Limpa";Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          $p=Start-Process $installer -ArgumentList ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="'+$dir+'"') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Instalação limpa falhou"}
          $info=Join-Path $dir "_internal/csm/build-info.json";$fiscal=Join-Path $dir "_internal/csm/CSM Fiscal Core.exe";$launcher=Join-Path $dir "CSM Visualizador XML.exe";$app=Join-Path $dir "_internal/web/app.js"
          foreach($f in @($info,$fiscal,$launcher,$app)){if(!(Test-Path $f)){throw "Arquivo instalado ausente: $f"}}
          $bi=Get-Content $info -Raw|ConvertFrom-Json
          if($bi.version -ne '3.13.0' -or !$bi.certificate_folder_manager -or !$bi.nfe_manifestacao_ciencia_210210 -or !$bi.nfe_native_workflow_3130){throw "Pacote instalado não é 3.13.0"}
          $txt=Get-Content $app -Raw
          if($txt -notmatch 'CSM_NATIVE_NFE_WORKFLOW_3130' -or $txt -notmatch 'Obter XML completo'){throw "Frontend 3.13.0 não instalado"}
          $fst=Start-Process $fiscal -ArgumentList 'selftest' -Wait -PassThru -WindowStyle Hidden
          if($fst.ExitCode -ne 0){throw "Fiscal Core instalado falhou"}
          $self=Start-Process $launcher -ArgumentList '--csm-launcher-selftest' -Wait -PassThru
          if($self.ExitCode -ne 0){throw "Launcher instalado falhou"}
          $un=Join-Path $dir 'unins000.exe';if(Test-Path $un){Start-Process $un -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait}

      - name: Validação final
        shell: pwsh
        run: |
          $exe=(Resolve-Path "dist/CSM Visualizador XML 3.13.0 - Instalador Completo.exe").Path
          $h=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if((Get-Item $exe).Length -lt 10000000){throw "Instalador pequeno demais"}
          $h | Set-Content "dist/CSM Visualizador XML 3.13.0 - SHA256.txt" -Encoding ascii
          Write-Host "SHA256=$h"

      - name: Publicar instalador homologado
        uses: actions/upload-artifact@v4
        with:
          name: CSMVisualizadorXML-3.13.0-Instalador-Final-v2
          path: |
            dist/CSM Visualizador XML 3.13.0 - Instalador Completo.exe
            dist/CSM Visualizador XML 3.13.0 - SHA256.txt
          if-no-files-found: error
          retention-days: 30
