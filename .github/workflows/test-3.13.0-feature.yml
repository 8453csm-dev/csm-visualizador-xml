name: Test CSM Visualizador XML 3.13.0 Feature

on:
  push:
    branches: ["feature/nfe-certificados-integrados"]
    paths:
      - "installer-v2/**"
      - ".github/workflows/test-3.13.0-feature.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cert-manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar Fiscal Core + gerenciador seguro 3.13.0
        shell: pwsh
        run: |
          python installer-v2/patch_fiscal_core_3121.py
          python installer-v2/patch_fiscal_core_cert_manager_3130.py
          python installer-v2/patch_cert_manager_paths_3130.py
          python installer-v2/patch_cert_manager_credential_manager_3130.py
          python installer-v2/patch_cert_manager_public_ids_3130.py
      - name: Testar registro e scanner A1
        shell: pwsh
        run: |
          python installer-v2/test_cert_manager_3130.py
      - name: Testar PFX real, senha candidata e sanitização
        shell: pwsh
        run: |
          python installer-v2/test_cert_manager_security_3130.py

  broker-certificates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Aplicar broker fiscal completo 3.13.0
        shell: pwsh
        run: |
          python installer-v2/patch_launcher_fiscal_core_3120.py
          python installer-v2/patch_launcher_cert_manager_3130.py
          python installer-v2/patch_launcher_manifestacao_3130.py
          python installer-v2/patch_launcher_nfe_actions_3130.py
      - name: Testar endpoints fiscais 3.13.0
        shell: pwsh
        run: |
          python installer-v2/test_launcher_cert_manager_3130.py
      - name: Compilar broker Go
        shell: pwsh
        run: |
          Get-ChildItem installer-v2/launcher -Filter *.go | ForEach-Object { gofmt -w $_.FullName }
          $env:GOOS='windows';$env:GOARCH='amd64';$env:CGO_ENABLED='0';$env:GO111MODULE='off'
          Push-Location installer-v2/launcher
          try { go build -trimpath -o "$env:TEMP\csm-launcher-3130.exe" .; if($LASTEXITCODE -ne 0){throw "Broker 3.13.0 não compilou"} } finally { Pop-Location }

  manifestacao:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar Fiscal Core completo com Ciência 3.13.0
        shell: pwsh
        run: |
          python installer-v2/patch_fiscal_core_3121.py
          python installer-v2/patch_fiscal_core_cert_manager_3130.py
          python installer-v2/patch_cert_manager_paths_3130.py
          python installer-v2/patch_cert_manager_credential_manager_3130.py
          python installer-v2/patch_cert_manager_public_ids_3130.py
          python installer-v2/patch_fiscal_core_manifestacao_3130.py
      - name: Testar contrato da Ciência da Operação
        shell: pwsh
        run: |
          python installer-v2/test_manifestacao_3130.py
      - name: Compilar e executar self-test do Fiscal Core
        shell: pwsh
        run: |
          $fx=Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319"
          $csc=Join-Path $fx "csc.exe"
          $src=(Resolve-Path "installer-v2/launcher/csm_fiscal_core.cs").Path
          $out=Join-Path $env:TEMP "CSM Fiscal Core 3130 Test.exe"
          & $csc /nologo /target:exe /optimize+ /platform:x64 "/out:$out" "/reference:$(Join-Path $fx 'System.Web.Extensions.dll')" "/reference:$(Join-Path $fx 'System.Security.dll')" "/reference:$(Join-Path $fx 'System.Xml.dll')" "/reference:$(Join-Path $fx 'System.Xml.Linq.dll')" $src
          if($LASTEXITCODE -ne 0){throw "Fiscal Core 3.13.0 não compilou"}
          $p=Start-Process $out -ArgumentList 'selftest' -Wait -PassThru -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw "Self-test Fiscal Core 3.13.0 falhou"}
