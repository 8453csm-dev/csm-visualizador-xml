name: Test CSM Visualizador XML 3.13.0 Feature

on:
  push:
    branches: ["feature/nfe-certificados-integrados"]
    paths:
      - "installer-v2/**"
      - ".github/workflows/test-3.13.0-feature.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cert-manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar Fiscal Core 3.12.1 + gerenciador 3.13.0
        shell: pwsh
        run: |
          python installer-v2/patch_fiscal_core_3121.py
          python installer-v2/patch_fiscal_core_cert_manager_3130.py
          python installer-v2/patch_cert_manager_paths_3130.py
      - name: Testar gerenciador A1 3.13.0
        shell: pwsh
        run: |
          python installer-v2/test_cert_manager_3130.py

  broker-certificates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar broker fiscal + certificados 3.13.0
        shell: pwsh
        run: |
          python installer-v2/patch_launcher_fiscal_core_3120.py
          python installer-v2/patch_launcher_cert_manager_3130.py
      - name: Testar endpoints de certificados 3.13.0
        shell: pwsh
        run: |
          python installer-v2/test_launcher_cert_manager_3130.py

  manifestacao:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar Fiscal Core com Ciência 3.13.0
        shell: pwsh
        run: |
          python installer-v2/patch_fiscal_core_3121.py
          python installer-v2/patch_fiscal_core_cert_manager_3130.py
          python installer-v2/patch_cert_manager_paths_3130.py
          python installer-v2/patch_fiscal_core_manifestacao_3130.py
      - name: Testar contrato da Ciência da Operação
        shell: pwsh
        run: |
          python installer-v2/test_manifestacao_3130.py
      - name: Compilar e executar self-test do Fiscal Core
        shell: pwsh
        run: |
          $fx=Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319"
          $csc=Join-Path $fx "csc.exe"
          $out=Join-Path $env:TEMP "CSM Fiscal Core 3130 Test.exe"
          & $csc /nologo /target:exe /optimize+ /platform:x64 "/out:$out" "/reference:$(Join-Path $fx 'System.Web.Extensions.dll')" "/reference:$(Join-Path $fx 'System.Security.dll')" "/reference:$(Join-Path $fx 'System.Xml.dll')" "/reference:$(Join-Path $fx 'System.Xml.Linq.dll')" installer-v2/launcher/csm_fiscal_core.cs
          if($LASTEXITCODE -ne 0){throw "Fiscal Core 3.13.0 não compilou"}
          $p=Start-Process $out -ArgumentList 'selftest' -Wait -PassThru -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw "Self-test Fiscal Core 3.13.0 falhou"}
