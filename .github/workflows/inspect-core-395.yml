name: Inspect Core 3.9.5

on:
  push:
    branches: ["release/3.9.5"]
    paths: [".github/workflows/inspect-core-395.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar e extrair base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install pyinstaller
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          gh release download v3.7.8 --repo 8453csm-dev/csm-visualizador-xml --pattern "CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" --dir temp
          python installer-v2/extract_payload.py "temp/CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" "installer-completo/enhancer_v8.html" "temp/payload"
      - name: Extrair PYZ e inspecionar modulos fiscais/app
        shell: pwsh
        run: |
          @'
          import dis, io, marshal, types, tempfile
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader, ZlibArchiveReader
          exe=Path(r"temp/payload/CSM Visualizador XML.exe")
          arch=CArchiveReader(str(exe))
          print('CARCHIVE:', list(arch.toc.keys()))
          pyz_name=next((n for n in arch.toc if 'PYZ' in n.upper()),None)
          if not pyz_name: raise SystemExit('PYZ nao encontrado')
          pyz_data=arch.extract(pyz_name)
          pyz_path=Path('temp/app.pyz');pyz_path.write_bytes(pyz_data)
          pyz=ZlibArchiveReader(str(pyz_path))
          names=list(pyz.toc.keys())
          candidates=[n for n in names if any(k in n.lower() for k in ('src.app','src','app','parser','document'))]
          print('CANDIDATES:', candidates)
          out=[]
          def walk(c,path):
              if c.co_name in {'open_folder','open_dropped_paths','open_recent','open_files','_load_paths','_load_file','load_paths'} or any(x in c.co_name.lower() for x in ('folder','dropped_paths')):
                  b=io.StringIO();
                  import contextlib
                  with contextlib.redirect_stdout(b):
                      print('\n###',path+'/'+c.co_name,'###');print('args=',c.co_varnames[:c.co_argcount]);print('names=',c.co_names);print('strings=',[x for x in c.co_consts if isinstance(x,str)]);dis.dis(c)
                  out.append(b.getvalue())
              for k in c.co_consts:
                  if isinstance(k,types.CodeType):walk(k,path+'/'+c.co_name)
          for name in candidates:
              try:
                  obj=pyz.extract(name)
                  if isinstance(obj,types.CodeType):walk(obj,name)
              except Exception as e: print('ERR',name,e)
          text=''.join(out)
          Path('temp/api-disassembly.txt').write_text(text,encoding='utf-8')
          print(text[:100000])
          '@ | Set-Content -Encoding utf8 temp/inspect.py
          python temp/inspect.py
      - uses: actions/upload-artifact@v4
        with:
          name: inspect-core-395
          path: temp/api-disassembly.txt
