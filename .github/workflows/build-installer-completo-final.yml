name: Build Instalador Completo Profissional

on:
  push:
    branches: ["release/instalador-completo-final", "fix/janela-invisivel-xml"]
    paths:
      - "installer-v2/**"
      - "installer-completo/enhancer_v8.html"
      - ".github/workflows/build-installer-completo-final.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "installer-v2/**"
      - "installer-completo/enhancer_v8.html"
      - ".github/workflows/build-installer-completo-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Baixar instalador oficial 3.7.8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path temp | Out-Null
          gh release download v3.7.8 `
            --repo 8453csm-dev/csm-visualizador-xml `
            --pattern "CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" `
            --dir temp

      - name: Validar e extrair payload real
        shell: pwsh
        run: |
          python installer-v2/extract_payload.py `
            "temp/CSMVisualizadorXML-3.7.8-Instalador-Completo.exe" `
            "installer-completo/enhancer_v8.html" `
            "installer-v2/payload"
          if (!(Test-Path "installer-v2/payload/CSM Visualizador XML.exe")) { throw "Executável principal ausente após extração" }
          if (!(Test-Path "installer-v2/payload/_internal/assets/CSMVisualizadorXML.ico")) { throw "Ícone oficial ausente após extração" }

      - name: Aplicar abas, etiquetas, tema e Localizador
        shell: pwsh
        run: |
          python installer-v2/patch_runtime.py "installer-v2/payload/_internal/web"
          python installer-v2/patch_lookup_order.py
          node --check "installer-v2/payload/_internal/web/app.js"
          if (!(Select-String -Path "installer-v2/payload/_internal/web/app.js" -Pattern "CSM_MULTI_TAB_BRIDGE_V1" -Quiet)) { throw "Bridge de abas não aplicado" }
          if (!(Select-String -Path "installer-v2/payload/_internal/web/app.js" -Pattern "CSM_LOCATOR_FIX_V1" -Quiet)) { throw "Correção do Localizador não aplicada" }
          if (!(Select-String -Path "installer-v2/payload/_internal/web/app.js" -Pattern "CSM_LOCATOR_HELPER_AFTER_WINDOW_V2" -Quiet)) { throw "Helper ainda inicia antes da janela" }
          if (!(Select-String -Path "installer-v2/payload/_internal/web/app.js" -Pattern "lookup-automation" -Quiet)) { throw "Frontend não chama o reforço de preenchimento" }
          if (!(Select-String -Path "installer-v2/payload/_internal/web/refinement.css" -Pattern "CSM_MULTI_TAB_BRIDGE_V1" -Quiet)) { throw "Correção visual não aplicada" }

      - name: Aplicar instancia unica estrita
        shell: pwsh
        run: |
          python installer-v2/patch_launcher_single_instance.py
          if (!(Select-String -Path "installer-v2/launcher/main.go" -Pattern "CSM_SINGLE_INSTANCE_STRICT_V2" -Quiet)) { throw "Patch de instancia unica estrita nao aplicado" }

      - name: Compilar helper Windows do Consulta DANFE
        shell: pwsh
        run: |
          python installer-v2/patch_launcher_lookup.py
          if (!(Select-String -Path "installer-v2/launcher/main.go" -Pattern "CSM_LOOKUP_AUTOMATION_V2" -Quiet)) { throw "Broker compilado do Localizador não aplicado" }
          New-Item -ItemType Directory -Force -Path "installer-v2/payload/_internal/csm" | Out-Null
          $fx = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319"
          $csc = Join-Path $fx "csc.exe"
          $uiaClient = Join-Path $fx "WPF\UIAutomationClient.dll"
          $uiaTypes = Join-Path $fx "WPF\UIAutomationTypes.dll"
          $forms = Join-Path $fx "System.Windows.Forms.dll"
          foreach($required in @($csc,$uiaClient,$uiaTypes,$forms)) { if (!(Test-Path $required)) { throw "Dependência de compilação ausente: $required" } }
          & $csc /nologo /target:winexe /optimize+ /platform:x64 `
            /out:"installer-v2/payload/_internal/csm/CSM Consulta DANFE Helper.exe" `
            /reference:"$uiaClient" /reference:"$uiaTypes" /reference:"$forms" `
            "installer-v2/launcher/consulta_danfe_helper.cs"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar helper Consulta DANFE: $LASTEXITCODE" }
          if (!(Test-Path "installer-v2/payload/_internal/csm/CSM Consulta DANFE Helper.exe")) { throw "Helper compilado não gerado" }
          if (Get-ChildItem "installer-v2/payload/_internal/csm" -Filter *.ps1 -ErrorAction SilentlyContinue) { throw "Build ainda contém script PowerShell no payload" }

      - name: Integrar launcher de instância única e recuperação
        shell: pwsh
        run: |
          $original = "installer-v2/payload/CSM Visualizador XML.exe"
          $core = "installer-v2/payload/CSM Visualizador XML Core.exe"
          Move-Item -Force $original $core
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-H windowsgui -s -w" `
            -o "installer-v2/payload/CSM Visualizador XML.exe" `
            "installer-v2/launcher/main.go"
          if (!(Test-Path "installer-v2/payload/CSM Visualizador XML.exe")) { throw "Launcher não gerado" }
          if (!(Test-Path $core)) { throw "Core original não preservado" }
          if (!(Test-Path "installer-v2/payload/_internal/csm/CSM Consulta DANFE Helper.exe")) { throw "Helper compilado do Consulta DANFE não empacotado" }
          $self = Start-Process -FilePath "installer-v2/payload/CSM Visualizador XML.exe" -ArgumentList '--csm-launcher-selftest' -Wait -PassThru
          if ($self.ExitCode -ne 0) { throw "Self-test do launcher falhou: $($self.ExitCode)" }

      - name: Gerar identidade visual do instalador
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python installer-v2/make_brand.py
          if (!(Test-Path "installer-v2/wizard.bmp")) { throw "Wizard image não gerada" }
          if (!(Test-Path "installer-v2/wizard-small.bmp")) { throw "Wizard small image não gerada" }

      - name: Instalar Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "ISCC.exe não encontrado" }

      - name: Compilar instalador profissional
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer-v2/CSMVisualizadorXML.iss"
          $clean = "dist/CSMVisualizadorXML-Instalador-Completo-Limpo.exe"
          if (!(Test-Path $clean)) { throw "Instalador final limpo não gerado" }

      - name: Teste de limpeza total e associação XML
        shell: pwsh
        run: ./installer-v2/test_clean_association.ps1

      - name: Teste real de instalação, instância única, abas e desinstalação
        shell: pwsh
        run: ./installer-v2/test_installed.ps1

      - name: Validar artefatos do Localizador
        shell: pwsh
        run: |
          if (!(Select-String -Path "installer-v2/payload/_internal/web/app.js" -Pattern "A consulta automática foi encerrada" -Quiet)) { throw "Timer terminal do Localizador ausente" }
          if (!(Select-String -Path "installer-v2/payload/_internal/web/app.js" -Pattern "lookup-automation" -Quiet)) { throw "Preenchimento reforçado do Localizador ausente" }
          if (!(Test-Path "installer-v2/payload/_internal/csm/CSM Consulta DANFE Helper.exe")) { throw "Helper Windows UIA ausente" }
          if (!(Select-String -Path "installer-v2/launcher/consulta_danfe_helper.cs" -Pattern "baixar xml" -Quiet)) { throw "Helper não contém busca por Baixar XML" }
          if (!(Select-String -Path "installer-v2/launcher/consulta_danfe_helper.cs" -Pattern "aceitar todos" -Quiet)) { throw "Helper não contém tratamento de cookies" }
          if (Get-ChildItem "installer-v2/payload/_internal/csm" -Filter *.ps1 -ErrorAction SilentlyContinue) { throw "Payload contém PowerShell e não é a build endurecida" }

      - name: Gerar checksum
        shell: pwsh
        run: |
          $exe = "dist/CSMVisualizadorXML-Instalador-Completo-Limpo.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$sha  CSMVisualizadorXML-Instalador-Completo-Limpo.exe" | Set-Content -Encoding ascii "dist/CSMVisualizadorXML-Instalador-Completo-Limpo-SHA256.txt"
          Write-Host "SHA256=$sha"

      - name: Publicar artefato de homologação
        uses: actions/upload-artifact@v4
        with:
          name: CSMVisualizadorXML-Localizador-Defender-Friendly
          path: |
            dist/CSMVisualizadorXML-Instalador-Completo-Limpo.exe
            dist/CSMVisualizadorXML-Instalador-Completo-Limpo-SHA256.txt
          if-no-files-found: error
          retention-days: 30
